name: CI

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    strategy:
      fail-fast: true
      matrix:
        include:
          - product: ec
            runner: ubuntu22
          - product: ec
            runner: ubuntu24
          - product: ec
            runner: ubuntu22-arm
          - product: ec
            runner: ubuntu24-arm
          - product: ec
            runner: self-hosted-generic-vm-amd64
          - product: osi
            runner: self-hosted-generic-vm-amd64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        
      - name: Install
        run: |
          make
          sudo install -m 0755 openvas-deployment /usr/bin/openvas-deployment
          echo '${{ secrets.FEED_KEY }}' > gsf.key
          echo '${{ secrets.OCI_CERT }}' > oci-client.cert
          echo '${{ secrets.OCI_KEY }}' > oci-client.key

      - name: CI ${{ matrix.product }}
        env:
          MHOSTS: yes
        run: bash regress/${{ matrix.product }}.sh
