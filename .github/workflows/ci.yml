name: CI

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    strategy:
      fail-fast: true
      matrix:
        include:
          # OEC
          - product: ec
            image: fedora:43
            runner: self-hosted-generic-vm-amd64
            skip: run
          - product: ec
            image: fedora:44
            runner: self-hosted-generic-vm-amd64
            skip: run
          - product: ec
            image: ubuntu:22.04
            runner: self-hosted-generic-vm-amd64
            skip: run
          - product: ec
            image: archlinux:latest
            runner: self-hosted-generic-vm-amd64
          - product: ec
            image: debian:12
            runner: self-hosted-generic-vm-amd64
          - product: ec
            image: debian:13
            runner: self-hosted-generic-vm-amd64
          # OEC ARM64
          - product: ec
            image: ubuntu:24.04
            runner: self-hosted-generic-vm-arm64
          # OSI
          - product: osi
            image: debian:12
            runner: self-hosted-generic-vm-amd64
          - product: osi
            image: archlinux:latest
            runner: self-hosted-generic-vm-amd64

    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        
      - name: Install binfmt
        if: matrix.runner == 'self-hosted-generic-vm-arm64'
        run: |
          docker run --privileged --rm tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0 --install amd64

      - name: Install test Certs
        env:
          FEED_KEY: ${{ secrets.FEED_KEY }}
          OCI_CERT: ${{ secrets.OCI_CERT }}
          OCI_KEY: ${{ secrets.OCI_KEY }}
          OEC_LICENSE: ${{ secrets.OEC_LICENSE }}
          OSI_LICENSE: ${{ secrets.OSI_LICENSE }}
        run: |
          printf '%s\n' "$FEED_KEY" > gsf.key
          printf '%s\n' "$OCI_CERT" > oci-client.cert
          printf '%s\n' "$OCI_KEY" > oci-client.key
          printf '%s\n' "$OEC_LICENSE" > oec-license.toml
          printf '%s\n' "$OSI_LICENSE" > osi-license.toml

      - name: Run regression test ${{ matrix.product }}
        run: |
          docker run --rm \
            --name openvas-deployment-ci \
            --network host \
            --user 0 \
            -e HOME=/root \
            -e MHOSTS=yes \
            -e SKIP=${{ matrix.skip }} \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v /etc/docker/certs.d:/etc/docker/certs.d \
            -v /etc/ssl/certs/ca-certificates.crt:/host-ca-certificates.crt:ro \
            -v /etc/hosts:/etc/hosts \
            -v "$(pwd)":/workspace \
            -w /workspace \
            ${{ matrix.image }} \
            sh -c 'bash regress/ci/run.sh "${{ matrix.product }}"'
